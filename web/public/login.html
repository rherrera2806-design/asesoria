<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Asesoria</title>
    <link rel="stylesheet" href="css/variables.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            pointer-events: none;
        }
        .bg-orb.orb1 { width: 500px; height: 500px; background: #3b82f6; top: -150px; left: -100px; }
        .bg-orb.orb2 { width: 400px; height: 400px; background: #8b5cf6; bottom: -100px; right: -50px; }
        .bg-orb.orb3 { width: 300px; height: 300px; background: #06b6d4; top: 50%; left: 60%; }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent), #fbbf24);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
        }

        .login-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .login-header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: #ffffff;
            font-size: 15px;
            transition: var(--transition-fast);
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), #d97706);
            color: #000000;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error-msg.show { display: block; }

        .login-footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .login-footer p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
        }

        .demo-creds {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }

        .demo-badge {
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-full);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .demo-badge:hover {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 480px) {
            .login-card { margin: 16px; padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">⚖</div>
            <h1>Sistema de Asesorias</h1>
            <p>Ingrese sus credenciales para acceder</p>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="email">Correo electronico</label>
                <input type="email" id="email" placeholder="usuario@asesoria.cl" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contrasena</label>
                <input type="password" id="password" placeholder="Ingrese su contrasena" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Ingresar</button>
        </form>

        <div class="login-footer">
            <p>Credenciales de demostracion</p>
            <div class="demo-creds">
                <span class="demo-badge" data-email="admin@asesoria.cl" data-pass="admin">Admin</span>
                <span class="demo-badge" data-email="visita@asesoria.cl" data-pass="visita">Visita</span>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.hostname === 'localhost'
            ? 'http://localhost:3001'
            : 'https://asesoria-api.onrender.com';

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const btnLogin = document.getElementById('btnLogin');

        // Redirect if already logged in
        if (localStorage.getItem('auth_token')) {
            window.location.href = 'app.html';
        }

        document.querySelectorAll('.demo-badge').forEach(badge => {
            badge.addEventListener('click', () => {
                document.getElementById('email').value = badge.dataset.email;
                document.getElementById('password').value = badge.dataset.pass;
                form.dispatchEvent(new Event('submit'));
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show');
            btnLogin.disabled = true;
            btnLogin.textContent = 'Ingresando...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Credenciales incorrectas');
                }

                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('auth_user', JSON.stringify(data.user));
                window.location.href = 'app.html';

            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.add('show');
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Ingresar';
            }
        });
    </script>
</body>
</html>
