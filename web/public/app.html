<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesoria - Seguimiento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
    <div class="app-layout" id="launcherView">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">A</div>
                <div class="sidebar-title">
                    Asesoria
                    <small>Seguimiento</small>
                </div>
                <button onclick="App.toggleCollapse()" id="sidebarCollapseBtn" style="margin-left:auto;background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;padding:4px;border-radius:4px;transition:color .15s" onmouseover="this.style.color='white'" onmouseout="this.style.color='rgba(255,255,255,.5)'">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div style="margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,.1);text-align:center">
                <span style="font-size:11px;color:rgba(255,255,255,.45);line-height:1.6">Creado por <strong style="color:rgba(255,255,255,.7)">Rodrigo Herrera</strong>,<br>amorcito de <strong style="color:rgba(255,255,255,.7)">Clau</strong> 💙</span>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="App.toggleSidebar()"></div>
        <header class="header">
            <button class="menu-toggle" onclick="App.toggleSidebar()" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="header-left">
                <div class="header-title" id="headerTitle">Asesoria</div>
            </div>
            <div class="header-right">
                <div class="header-date" id="currentDate"></div>
                <div class="header-user">
                    <span id="userRole" class="role-badge" style="margin-right:8px"></span>
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span id="userName">Usuario</span>
                    <button onclick="Auth.logout()" style="margin-left:8px;padding:4px 10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:white;font-size:11px;cursor:pointer;font-weight:600">Salir</button>
                </div>
            </div>
        </header>
        <main class="main-content" id="mainContent">
            <div class="page active" id="page-dashboard"></div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalHeaderTitle">Titulo</h3>
                <button class="modal-close" onclick="App.hideModal()">&times;</button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="App.hideModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="alertContainer" style="position:fixed;top:20px;right:20px;z-index:2000;max-width:400px"></div>

    <style>
        .role-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
        .role-admin{background:rgba(59,130,246,.2);color:#93c5fd;border:1px solid rgba(59,130,246,.3)}
        .role-visita{background:rgba(34,197,94,.2);color:#86efac;border:1px solid rgba(34,197,94,.3)}
    </style>

    <script>
        if (!localStorage.getItem('auth_token')) {
            window.location.href = 'login.html';
        }
    </script>

    <script src="/js/app-main.js"></script>
    <script src="/js/modules/asesoria.js"></script>
    <script src="/js/modules/asesoria-calendar.js"></script>
    <script src="/js/modules/usuarios.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
</body>
</html>
